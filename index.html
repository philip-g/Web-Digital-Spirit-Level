<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" width=device-width, initial-scale=1.0">
    <title>Horizontal Line - Gyroscope</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        
        .line {
            width: 80vw;
            height: 4px;
            background: linear-gradient(90deg, #00f5ff, #00ff88);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            transition: transform 0.05s linear;
            border-radius: 2px;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            opacity: 0.7;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 15px;
            font-size: 12px;
            background: #2a2a3e;
            color: #fff;
            border: 1px solid #00f5ff;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .btn.active {
            background: #00f5ff;
            color: #000;
        }
        
        .permission-btn {
            padding: 15px 30px;
            font-size: 16px;
            background: #00f5ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="line" id="line"></div>
    <div class="info" id="info">Initializing...</div>
    <div class="controls" id="controls" style="display: none;">
        <button class="btn active" data-mode="0">atan2(y, x)</button>
        <button class="btn" data-mode="1">atan2(x, y)</button>
        <button class="btn" data-mode="2">atan2(-y, -x)</button>
        <button class="btn" data-mode="3">atan2(-x, -y)</button>
    </div>
    <button class="permission-btn" id="permissionBtn" style="display: none;">Enable Sensors</button>

    <script>
        const line = document.getElementById('line');
        const info = document.getElementById('info');
        const permissionBtn = document.getElementById('permissionBtn');
        const controls = document.getElementById('controls');
        
        const RAD_TO_DEG = 180 / Math.PI;
        let currentMode = 0;
        
        // Add click handlers for mode buttons
        controls.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                controls.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = parseInt(btn.dataset.mode);
            });
        });
        
        function handleMotion(event) {
            const gravity = event.accelerationIncludingGravity;
            
            if (!gravity || gravity.x === null || gravity.y === null) {
                return;
            }
            
            const x = gravity.x;
            const y = gravity.y;
            
            let roll;
            switch(currentMode) {
                case 0:
                    roll = Math.atan2(y, x) * RAD_TO_DEG;
                    break;
                case 1:
                    roll = Math.atan2(x, y) * RAD_TO_DEG;
                    break;
                case 2:
                    roll = Math.atan2(-y, -x) * RAD_TO_DEG;
                    break;
                case 3:
                    roll = Math.atan2(-x, -y) * RAD_TO_DEG;
                    break;
            }
            
            line.style.transform = `rotate(${roll}deg)`;
            
            info.textContent = `x: ${x.toFixed(2)} | y: ${y.toFixed(2)} | roll: ${roll.toFixed(1)}°`;
        }
        
        async function init() {
            if (!window.DeviceMotionEvent) {
                info.textContent = 'Device motion not supported';
                return;
            }
            
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                permissionBtn.style.display = 'block';
                permissionBtn.onclick = async () => {
                    try {
                        const permission = await DeviceMotionEvent.requestPermission();
                        if (permission === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            permissionBtn.style.display = 'none';
                            controls.style.display = 'flex';
                            info.textContent = 'Tilt your device...';
                        } else {
                            info.textContent = 'Permission denied';
                        }
                    } catch (error) {
                        info.textContent = 'Error: ' + error.message;
                    }
                };
            } else {
                window.addEventListener('devicemotion', handleMotion);
                controls.style.display = 'flex';
                info.textContent = 'Tilt your device...';
            }
        }
        
        init();
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Spirit Level</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <video id="camera" autoplay playsinline></video>

  <div id="overlay">
    <div id="level-line"></div>

    <div id="angle-display">0°</div>

    <div id="debug-panel">
      <div>α: <span id="alpha">0</span>°</div>
      <div>β: <span id="beta">0</span>°</div>
      <div>γ: <span id="gamma">0</span>°</div>
    </div>

    <div id="controls">
      <label class="switch">
        <input type="checkbox" id="cameraToggle">
        <span class="slider"></span>
        <span class="label-text">Camera</span>
      </label>

      <label class="switch">
        <input type="checkbox" id="debugToggle">
        <span class="slider"></span>
        <span class="label-text">Debug</span>
      </label>
    </div>

  </div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- gl-matrix library -->
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>

<script src="js/app.js"></script>
</body>
</html>

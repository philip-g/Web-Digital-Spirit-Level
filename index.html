<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Line - Gyroscope</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="camera" autoplay playsinline></video>
    
    <div class="line" id="line"></div>
    
    <div class="angle-display" id="angleDisplay">0°</div>
    
    <div class="info" id="info">Initializing...</div>
    
    <div class="controls">
        <div class="toggle-container">
            <label class="toggle-label">Camera</label>
            <label class="toggle-switch">
                <input type="checkbox" id="cameraToggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <button class="btn" id="calibrateToggle">🎯 Calibrate</button>
    </div>
    
    <button class="permission-btn" id="permissionBtn" style="display: none;">Enable Sensors</button>
    
    <div class="calibration" id="calibration">
        <h2>Calibration</h2>
        <p>Hold your phone upright in portrait mode,<br>then tap the button below.</p>
        <button id="calibrateBtn">Calibrate</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

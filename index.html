<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Line - Gyroscope</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        
        .line {
            width: 80vw;
            height: 4px;
            background: linear-gradient(90deg, #00f5ff, #00ff88);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            transition: transform 0.05s linear;
            border-radius: 2px;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            opacity: 0.7;
        }
        
        .permission-btn {
            padding: 15px 30px;
            font-size: 16px;
            background: #00f5ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="line" id="line"></div>
    <div class="info" id="info">Initializing...</div>
    <button class="permission-btn" id="permissionBtn" style="display: none;">Enable Sensors</button>

    <script>
        const line = document.getElementById('line');
        const info = document.getElementById('info');
        const permissionBtn = document.getElementById('permissionBtn');
        
        const RAD_TO_DEG = 180 / Math.PI;
        
        function handleMotion(event) {
            // Use gravity vector from accelerometer
            // This avoids gimbal lock entirely
            const gravity = event.accelerationIncludingGravity;
            
            if (!gravity || gravity.x === null || gravity.y === null) {
                return;
            }
            
            // Calculate roll angle from gravity vector in screen plane
            // atan2(x, y) gives us the angle of the "down" direction
            // Negative to counter-rotate and keep line horizontal
            const roll = Math.atan2(gravity.x, gravity.y) * RAD_TO_DEG;
            
            line.style.transform = `rotate(${roll}deg)`;
            
            // Update debug info
            info.textContent = `x: ${gravity.x?.toFixed(2)} | y: ${gravity.y?.toFixed(2)} | roll: ${roll.toFixed(1)}°`;
        }
        
        async function init() {
            // Check if DeviceMotionEvent is supported
            if (!window.DeviceMotionEvent) {
                info.textContent = 'Device motion not supported';
                return;
            }
            
            // iOS 13+ requires permission
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                permissionBtn.style.display = 'block';
                permissionBtn.onclick = async () => {
                    try {
                        const permission = await DeviceMotionEvent.requestPermission();
                        if (permission === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            permissionBtn.style.display = 'none';
                            info.textContent = 'Tilt your device...';
                        } else {
                            info.textContent = 'Permission denied';
                        }
                    } catch (error) {
                        info.textContent = 'Error: ' + error.message;
                    }
                };
            } else {
                // Non-iOS or older iOS
                window.addEventListener('devicemotion', handleMotion);
                info.textContent = 'Tilt your device...';
            }
        }
        
        init();
    </script>
</body>
</html>

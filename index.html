
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Spirit Level</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">

<div class="container-fluid min-vh-100 d-flex flex-column justify-content-between">

  <!-- Header -->
  <header class="text-center py-3">
    <h1 class="h4">Digital Spirit Level</h1>
    <p class="small text-secondary mb-0">
      Uses DeviceOrientation & Camera API
    </p>
  </header>

  <!-- Main view -->
  <main class="flex-grow-1 d-flex justify-content-center align-items-center">
    <div id="viewport">

      <!-- Camera -->
      <video id="camera" autoplay playsinline></video>

      <!-- Overlay -->
      <div id="overlay">
        <div id="level-line"></div>
        <div id="angle-display">0°</div>
      </div>

    </div>
  </main>

  <!-- Controls -->
  <footer class="py-3 text-center">
    <div class="form-check form-switch d-inline-flex align-items-center gap-2">
      <input class="form-check-input" type="checkbox" id="cameraToggle">
      <label class="form-check-label" for="cameraToggle">
        Camera
      </label>
    </div>
  </footer>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
</body>
</html>
